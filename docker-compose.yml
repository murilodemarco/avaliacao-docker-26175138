# docker-compose.yml · ViaSerra Transportes
#
# Este arquivo sobe os dois sites de uma vez, no lugar de dois "docker run".
# Complete as 4 lacunas marcadas com ____ e rode:  docker compose up -d
# Não mude a indentação: no YAML, os espaços no começo da linha fazem parte da sintaxe.

services:
  portal:
    image: murilodemarco/viaserra-portal:1.0-26175138
    ports:
      - "8038:80"
    restart: unless-stopped
  manutencao:
    build: ./manutencao
    ports:
      - "7038:80"
    restart: unless-stopped
